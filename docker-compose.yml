version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: cytutor-db
    environment:
      POSTGRES_DB: cytutor
      POSTGRES_USER: cytutor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cytutor-backend
    environment:
      DATABASE_URL: postgresql://cytutor:${DB_PASSWORD:-changeme}@postgres:5432/cytutor
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      PORT: 3001
      NODE_ENV: production
      CHALLENGE_PORT_MIN: 10000
      CHALLENGE_PORT_MAX: 20000
      CHALLENGE_TIMEOUT_MINUTES: 45
    ports:
      - "3001:3001"
      - "10000-20000:10000-20000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
