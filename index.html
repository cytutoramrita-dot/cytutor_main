<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyTutor - Cybersecurity Learning Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          screens: {
            '2xl': {'max': '1535px'},
            'xl': {'max': '1279px'},
            'lg': {'max': '1023px'},
            'md': {'max': '767px'},
            'sm': {'max': '639px'},
          },
          extend: {
            colors: {
              neon: {
                green: '#22c55e',
                dark: '#16a34a',
                purple: '#6E40C9'
              },
              bg: {
                void: '#000000',
                dark: '#0a0a0a',
                card: 'rgba(10, 10, 10, 0.95)',
                glass: 'rgba(0, 0, 0, 0.8)'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      [data-theme="dark"] {
        --bg-primary: #000000;
        --bg-secondary: #0a0a0a;
        --bg-glass: rgba(10,10,10,0.7);
        --border-subtle: rgba(255,255,255,0.05);
        --border-accent: rgba(34,197,94,0.2);
        --text-primary: #e5e5e5;
        --text-secondary: #9ca3af;
        --text-muted: #6b7280;
        --accent-primary: #22c55e;
        --accent-primary-dark: #16a34a;
        --accent-secondary: #6E40C9;
        --input-bg: rgba(0,0,0,0.5);
        --scrollbar-track: #0a0a0a;
        --scrollbar-thumb: #22c55e;
      }
      [data-theme="light"] {
        --bg-primary: #f0f4f8;
        --bg-secondary: #ffffff;
        --bg-glass: rgba(255,255,255,0.75);
        --border-subtle: rgba(0,0,0,0.07);
        --border-accent: rgba(13,148,136,0.35);
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --accent-primary: #0d9488;
        --accent-primary-dark: #0f766e;
        --accent-secondary: #4f46e5;
        --input-bg: rgba(0,0,0,0.05);
        --scrollbar-track: #e2e8f0;
        --scrollbar-thumb: #0d9488;
      }
      *, *::before, *::after {
        transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease;
      }
      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
      }
      .glass-panel {
        background: var(--bg-glass);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border-accent);
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Custom Scrollbar for other elements */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent-primary-dark);
      }

      /* ── Light mode overrides for hardcoded Tailwind dark classes ── */
      [data-theme="light"] .bg-black,
      [data-theme="light"] .bg-bg-void,
      [data-theme="light"] .bg-bg-dark {
        background-color: var(--bg-primary) !important;
      }
      [data-theme="light"] .bg-bg-card {
        background-color: var(--bg-secondary) !important;
      }
      /* Semi-transparent black overlays → light equivalents */
      [data-theme="light"] .bg-black\/20 { background-color: rgba(0,0,0,0.04) !important; }
      [data-theme="light"] .bg-black\/40 { background-color: var(--input-bg) !important; }
      [data-theme="light"] .bg-black\/50 { background-color: var(--input-bg) !important; }
      [data-theme="light"] .bg-black\/60 { background-color: rgba(0,0,0,0.06) !important; }
      [data-theme="light"] .bg-black\/70 { background-color: rgba(0,0,0,0.07) !important; }
      [data-theme="light"] .bg-black\/80 { background-color: rgba(0,0,0,0.08) !important; }
      [data-theme="light"] .bg-bg-dark\/95 { background-color: rgba(255,255,255,0.97) !important; }
      /* Text overrides */
      [data-theme="light"] .text-white { color: var(--text-primary) !important; }
      [data-theme="light"] .text-gray-200 { color: var(--text-primary) !important; }
      [data-theme="light"] .text-gray-300 { color: var(--text-secondary) !important; }
      [data-theme="light"] .text-gray-400 { color: var(--text-secondary) !important; }
      [data-theme="light"] .text-gray-500 { color: var(--text-muted) !important; }
      [data-theme="light"] .text-gray-600 { color: var(--text-muted) !important; }
      /* Border overrides */
      [data-theme="light"] .border-white\/10 { border-color: var(--border-subtle) !important; }
      [data-theme="light"] .border-gray-700 { border-color: var(--border-subtle) !important; }
      [data-theme="light"] .border-gray-800 { border-color: var(--border-subtle) !important; }
      /* Input fields */
      [data-theme="light"] input,
      [data-theme="light"] textarea,
      [data-theme="light"] select {
        background-color: var(--bg-secondary) !important;
        color: var(--text-primary) !important;
        border-color: var(--border-subtle) !important;
      }
      [data-theme="light"] input::placeholder,
      [data-theme="light"] textarea::placeholder {
        color: var(--text-muted) !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('cytutor_theme');
        document.documentElement.setAttribute('data-theme', (t === 'light' ? 'light' : 'dark'));
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
